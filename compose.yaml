services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farmer_market
      POSTGRES_USER: farmer_app
      POSTGRES_PASSWORD: farmer_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmer_app -d farmer_market"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

